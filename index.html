<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (served from /public so it resolves in the production build) -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="apple-touch-icon" href="/aajoo-logo.png" />

    <!-- Primary SEO -->
    <title>Aajoo — India's Negotiation-First Stay Marketplace</title>
    <meta
      name="description"
      content="Aajoo is India's negotiation-first stay marketplace. Discover homestays and short-term rentals, negotiate the price directly with hosts, and book highly rated stays across India."
    />
    <meta name="theme-color" content="#1B2447" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Aajoo Homes" />

    <!-- Open Graph (WhatsApp / Facebook / LinkedIn link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aajoo" />
    <meta property="og:title" content="Aajoo — India's Negotiation-First Stay Marketplace" />
    <meta
      property="og:description"
      content="Discover homestays and short-term rentals, negotiate prices directly with hosts, and book highly rated stays across India."
    />
    <meta property="og:image" content="/aajoo-logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aajoo — India's Negotiation-First Stay Marketplace" />
    <meta
      name="twitter:description"
      content="Discover homestays and short-term rentals, negotiate prices directly with hosts, and book highly rated stays across India."
    />
    <meta name="twitter:image" content="/aajoo-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
